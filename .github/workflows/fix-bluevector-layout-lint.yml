name: BlueVector one-shot layout lint repair

on:
  push:
    branches:
      - delivery/bluevector-final-chatgpt-20260910

permissions:
  contents: write

concurrency:
  group: bluevector-layout-lint-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: delivery/bluevector-final-chatgpt-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove redundant effect state updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/components/layout/AppLayout.jsx')
          text = path.read_text(encoding='utf-8')

          old_initial = "    setIsMobile(mediaQuery.matches);\n    mediaQuery.addEventListener?.('change', handleChange);"
          new_initial = "    mediaQuery.addEventListener?.('change', handleChange);"
          if text.count(old_initial) != 1:
              raise SystemExit('Initial mobile state effect pattern not found exactly once')
          text = text.replace(old_initial, new_initial, 1)

          old_navigation = "  useEffect(() => {\n    if (isMobile) setMobileMenuOpen(false);\n  }, [isMobile, normalizedCurrentPage]);\n\n"
          if text.count(old_navigation) != 1:
              raise SystemExit('Navigation close effect pattern not found exactly once')
          text = text.replace(old_navigation, '', 1)

          path.write_text(text, encoding='utf-8', newline='')
          PY
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/components/layout/AppLayout.jsx
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'fix(web): remove redundant mobile effect updates'
          git push origin HEAD:delivery/bluevector-final-chatgpt-20260910
