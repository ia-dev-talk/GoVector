name: GoVector quality

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Public GoVector API base URL for pilot APK"
        required: false
        default: "https://api.invalid/api/v1"
        type: string
  pull_request:
  push:
    branches:
      - main
      - "release/**"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m alembic heads
      - run: python -m pytest -q backend/tests

  postgres-geolocation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fieldopt
          POSTGRES_PASSWORD: fieldopt
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldopt -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BLUEVECTOR_POSTGRES_CONTRACT_ADMIN_URL: >-
        postgresql://fieldopt:fieldopt@localhost:5432/postgres
      # Legacy V024 uses this name; both point to the disposable CI service.
      BLUEVECTOR_TEST_DATABASE_ADMIN_URL: >-
        postgresql://fieldopt:fieldopt@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Validate clean PostgreSQL bootstrap
        env:
          DATABASE_URL: postgresql+asyncpg://fieldopt:fieldopt@localhost:5432/postgres
        run: |
          python -m backend.database.bootstrap_schema
          python -m backend.database.bootstrap_schema
          python -m alembic current
      # Run discovery with PostgreSQL configured so new connected contracts
      # (GIS, client policies, Orienteur, migrations) cannot silently skip.
      - run: python -m pytest -q -rs backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  pilot-4g-config:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate local + 4G Docker profile
        shell: bash
        run: |
          set -euo pipefail
          export SECRET_KEY=ci-only-strong-secret-for-compose-validation
          docker compose --profile pilot-4g config --quiet
          services="$(docker compose --profile pilot-4g config --services)"
          grep -qx 'pilot-edge' <<<"$services"
          grep -qx 'pilot-tunnel' <<<"$services"
          rendered="$(docker compose --profile pilot-4g config)"
          grep -Eq 'host_ip:[[:space:]]+127\.0\.0\.1' <<<"$rendered"
          docker compose --profile pilot-4g config --format json | python -c 'import json, sys; environment = json.load(sys.stdin)["services"]["migrate"]["environment"]; assert environment["API_RELOAD"] == "false"; assert "CORS_ORIGINS" in environment'
      - name: Build pilot image and prove PDF renderer
        shell: bash
        run: |
          set -euo pipefail
          docker build -t govector-pilot-ci .
          docker run --rm govector-pilot-ci python -c "from weasyprint import HTML; pdf = HTML(string='<h1>GoVector PDF smoke test</h1>').write_pdf(); assert pdf.startswith(b'%PDF-'); print('PDF_OK', len(pdf))"

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Build pilot release APK
        timeout-minutes: 20
        env:
          ORG_GRADLE_PROJECT_pilotSigning: "true"
          API_BASE_URL: ${{ inputs.api_base_url || 'https://api.invalid/api/v1' }}
        run: >-
          flutter build apk --release --no-pub
          --dart-define=API_BASE_URL=${API_BASE_URL}
      - name: Publish pilot APK artifact
        # Artifact storage is an external GitHub account quota. The APK build
        # itself remains a hard release gate above; a full artifact quota must
        # not turn a valid source/build into a false-negative CI result.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: govector-pilot-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
