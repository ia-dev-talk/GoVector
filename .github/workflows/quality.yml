name: BlueVector quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m alembic heads
      - run: python -m pytest -q backend/tests

  postgres-geolocation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fieldopt
          POSTGRES_PASSWORD: fieldopt
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldopt -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BLUEVECTOR_POSTGRES_CONTRACT_ADMIN_URL: >-
        postgresql://fieldopt:fieldopt@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Validate clean PostgreSQL bootstrap
        env:
          DATABASE_URL: postgresql+asyncpg://fieldopt:fieldopt@localhost:5432/postgres
        run: |
          python -m backend.database.bootstrap_schema
          python -m backend.database.bootstrap_schema
          python -m alembic current
      - run: >-
          python -m pytest -q
          backend/tests/test_geolocation_postgres_contract.py
          backend/tests/test_stock_allocation_postgres_contract.py
          backend/tests/test_technician_field_stock_postgres_contract.py
          backend/tests/test_completion_evidence_postgres_contract.py
          backend/tests/test_alembic_v031.py
          backend/tests/test_alembic_v032.py
          backend/tests/test_alembic_v033.py
          backend/tests/test_alembic_v035.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Build pilot release APK
        timeout-minutes: 20
        env:
          ORG_GRADLE_PROJECT_pilotSigning: "true"
        run: >-
          flutter build apk --release --no-pub
          --dart-define=API_BASE_URL=https://api.invalid/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: bluevector-pilot-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
