<body><div id="qa-root"></div><script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import OrienteurAssessment from '../src/features/intervention-detail/OrienteurAssessment.jsx';
import OperationalSettingsSection from '../src/components/settings/OperationalSettingsSection.jsx';
import CompletionPolicySettingsSection from '../src/components/settings/CompletionPolicySettingsSection.jsx';
import ParametresPage from '../src/pages/ParametresPage.jsx';
import GisDatasetWorkspace from '../src/features/sectors/GisDatasetWorkspace.jsx';
import MapWindow from '../src/components/MapWindow.jsx';
import '../src/styles/index.css';

import '../src/styles/bluevector-v3.css';

import '../src/styles/shell-v08.css';
import '../src/styles/operations-final-v08.css';
import '../src/styles/intervention-v08-layout.css';
import '../src/styles/stock-responsive-v08.css';
import '../src/styles/supervision-responsive-v08.css';
import '../src/styles/cockpit-readability-v08.css';
import '../src/styles/stock-scope-final-v08.css';
import '../src/styles/intervention-detail.css';
import '../src/styles/settings-v1-admin.css';
const root = createRoot(document.getElementById('qa-root'));
window.renderAssessment = (id) => root.render(React.createElement(OrienteurAssessment, {key: id, jobId: id}));
window.renderSettings = () => root.render(React.createElement(OperationalSettingsSection));
window.renderCompletion = () => root.render(React.createElement(CompletionPolicySettingsSection, {userRole: 'ADMIN'}));
window.renderSettingsPage = () => root.render(React.createElement(ParametresPage, {userRole: 'ADMIN'}));
window.renderGis = () => root.render(React.createElement(GisDatasetWorkspace));
window.renderPilotMap = () => root.render(React.createElement(MapWindow, {
  technicians: [{ id: 7, name: 'Technicien pilote', current_latitude: 33.5731, current_longitude: -7.5898, status: 'EN_ROUTE' }],
  jobs: [{ id: 42, job_number: 'GV-42', customer_name: 'Client pilote', latitude: 33.58, longitude: -7.6, status: 'EN_COURS' }],
  floating: false,
  style: { height: '520px' },
  onReady: (map) => { window.pilotMapInstance = map; },
}));
window.renderAssessment(1);
</script></body></html>
