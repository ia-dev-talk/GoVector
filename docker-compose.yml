# GoVector / BlueVector — single-container app (built SPA + FastAPI) + PostgreSQL.
#
# Run regular:  make up        (or: docker compose up --build)
# Run demo:     make demo      (or: IS_DEMO=true docker compose up --build)
# Run 4G pilot: docker compose --profile pilot-4g up -d --build
#
# Local dashboard: http://localhost:8080
# The optional pilot-4g profile exposes ONLY /health and /api/v1/* through
# Cloudflare Quick Tunnel. PostgreSQL and the dashboard remain local.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldopt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldopt}
      POSTGRES_DB: ${POSTGRES_DB:-fieldopt}
    ports:
    - "127.0.0.1:${BLUEVECTOR_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://fieldopt:fieldopt@postgres:5432/fieldopt}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_SUPER_SECRET_KEY}
    command: ["python", "-m", "backend.database.bootstrap_schema"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://fieldopt:fieldopt@postgres:5432/fieldopt}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_SUPER_SECRET_KEY}
      IS_DEMO: ${IS_DEMO:-false}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_RELOAD: "false"
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:8080","http://localhost:5173"]}'
      LOG_LEVEL: INFO
      PYTHONPATH: /app/backend
      TECHNICIAN_MEDIA_ROOT: /app/uploads/technician_media
    volumes:
      - technician_media:/app/uploads/technician_media
    ports:
      - "${BLUEVECTOR_HTTP_PORT:-8080}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  pilot-edge:
    image: nginx:1.27-alpine
    profiles: ["pilot-4g"]
    volumes:
      - ./deploy/pilot-edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  pilot-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["pilot-4g"]
    command: tunnel --no-autoupdate --url http://pilot-edge:8080
    depends_on:
      - pilot-edge
    restart: unless-stopped

volumes:
  postgres_data:
  technician_media:
